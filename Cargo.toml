[package]
name = "scrollcapture_rust"
version = "0.1.0"
edition = "2021"

[dependencies]
winapi = { version = "0.3.9", features = [
    "winuser",
    "wingdi",
    "windef",
    "winbase",
    "shellapi",
    "sysinfoapi",
    "commctrl"
] }
image = { version = "0.25", default-features = false, features = ["png"] }
